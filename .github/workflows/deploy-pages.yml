# Publishes the teaser to GitHub Pages.
#
# The site is plain static files at the repository root, so there is nothing to
# build — the checkout is uploaded as-is.
#
# NOTE: this deploys from the development branch, which is the only branch in
# the repository today. Once the work lands on a default branch, change the
# `branches:` list below to that branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/ahlanrishta-teaser-website-oandgf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
